name: Verify NES routine translations

on:
  push:
    paths:
      - "3ds-port/source/nes_routines.c"
      - "3ds-port/include/nes_routines.h"
      - "3ds-port/tests/**"
      - "3ds-port/tools/**"
      - "3ds-port/source/nes_chr_decode.c"
      - "3ds-port/include/nes_chr_decode.h"
      - "3ds-port/source/nes_rom_identify.c"
      - "3ds-port/include/nes_rom_identify.h"
      - "3ds-port/source/nes_chr_cache.c"
      - "3ds-port/include/nes_chr_cache.h"
      - "3ds-port/source/nes_active_stream.c"
      - "3ds-port/include/nes_active_stream.h"
      - "3ds-port/source/asset_extractor.c"
      - "3ds-port/include/asset_extractor.h"
      - "3ds-port/source/game.c"
      - "3ds-port/source/menus.c"
      - "3ds-port/include/menus.h"
      - "3ds-port/source/menu_tape_file.c"
      - "3ds-port/include/menu_tape_file.h"
      - "3ds-port/source/game_state.c"
      - "3ds-port/include/game_state.h"
      - "3ds-port/source/renderer.c"
      - "3ds-port/source/nes_ppu_render.c"
      - "3ds-port/include/nes_ppu_render.h"
      - "3ds-port/source/nes_ppu_commands.c"
      - "3ds-port/include/nes_ppu_commands.h"
      - "3ds-port/source/asset_export.c"
      - "3ds-port/include/asset_export.h"
      - "3ds-port/include/third_party/stb_image_write.h"
      - "3ds-port/tests/test_nes_chr_decode.c"
      - "3ds-port/source/nes_race_setup.c"
      - "3ds-port/include/nes_race_setup.h"
      - "3ds-port/tests/test_nes_race_setup.c"
      - "3ds-port/source/nes_gen_code.c"
      - "3ds-port/source/nes_call.c"
      - "3ds-port/include/nes_machine.h"
      - "3ds-port/tools/**"
      - "3ds-port/tests/oracle/**"
      - "3ds-port/tests/test_gen_code.c"
      - ".github/workflows/test-nes-routines.yml"
  pull_request:
    paths:
      - "3ds-port/source/nes_routines.c"
      - "3ds-port/include/nes_routines.h"
      - "3ds-port/tests/**"
      - "3ds-port/tools/**"
      - "3ds-port/source/nes_chr_decode.c"
      - "3ds-port/include/nes_chr_decode.h"
      - "3ds-port/source/nes_rom_identify.c"
      - "3ds-port/include/nes_rom_identify.h"
      - "3ds-port/source/nes_chr_cache.c"
      - "3ds-port/include/nes_chr_cache.h"
      - "3ds-port/source/nes_active_stream.c"
      - "3ds-port/include/nes_active_stream.h"
      - "3ds-port/source/nes_ppu_render.c"
      - "3ds-port/include/nes_ppu_render.h"
      - "3ds-port/source/asset_extractor.c"
      - "3ds-port/include/asset_extractor.h"
      - "3ds-port/source/game.c"
      - "3ds-port/source/menus.c"
      - "3ds-port/include/menus.h"
      - "3ds-port/source/menu_tape_file.c"
      - "3ds-port/include/menu_tape_file.h"
      - "3ds-port/source/game_state.c"
      - "3ds-port/include/game_state.h"
      - "3ds-port/source/renderer.c"
      - "3ds-port/source/asset_export.c"
      - "3ds-port/include/asset_export.h"
      - "3ds-port/include/third_party/stb_image_write.h"
      - ".github/workflows/test-nes-routines.yml"
  workflow_dispatch:

jobs:
  exhaustive-sub-da15:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python for extraction-tool tests
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Test Python CHR extraction tools
        run: python -m unittest discover -s 3ds-port/tools -p 'test_*.py'
      - name: Compile host-side reference test
        run: gcc -std=c11 -O2 -Wall -Wextra -Werror -I3ds-port/include 3ds-port/source/nes_routines.c 3ds-port/tests/test_nes_routines.c -o test_nes_routines
      - name: Exhaustively compare all 8-bit inputs
        run: ./test_nes_routines
      - name: Compile host-side runtime CHR decoder test
        run: gcc -std=c11 -O2 -Wall -Wextra -Werror -I3ds-port/include 3ds-port/source/nes_chr_decode.c 3ds-port/tests/test_nes_chr_decode.c -o test_nes_chr_decode
      - name: Test runtime CHR decoder
        run: ./test_nes_chr_decode
      - name: Compile ROM identity test
        run: gcc -std=c11 -O2 -Wall -Wextra -Werror -I3ds-port/include 3ds-port/source/nes_rom_identify.c 3ds-port/tests/test_nes_rom_identify.c -o test_nes_rom_identify
      - name: Test ROM identity
        run: ./test_nes_rom_identify
      - name: Compile decoded-pixel cache test
        run: gcc -std=c11 -O2 -Wall -Wextra -Werror -I3ds-port/include 3ds-port/source/nes_chr_cache.c 3ds-port/tests/test_nes_chr_cache.c -o test_nes_chr_cache
      - name: Test decoded-pixel cache
        run: ./test_nes_chr_cache
      - name: Compile active command-stream trace test
        run: gcc -std=c11 -O2 -Wall -Wextra -Werror -I3ds-port/include 3ds-port/source/nes_active_stream.c 3ds-port/source/nes_ppu_commands.c 3ds-port/tests/test_nes_active_stream.c -o test_nes_active_stream
      - name: Test active command-stream trace
        run: ./test_nes_active_stream
      - name: Compile native PPU renderer regression test
        run: gcc -std=c11 -O2 -Wall -Wextra -Werror -I3ds-port/include 3ds-port/source/nes_ppu_render.c 3ds-port/tests/test_nes_ppu_render.c -o test_nes_ppu_render
      - name: Test native PPU renderer
        run: ./test_nes_ppu_render
      - name: Compile source-derived PPU command interpreter test
        run: gcc -std=c11 -O2 -Wall -Wextra -Werror -I3ds-port/include 3ds-port/source/nes_ppu_commands.c 3ds-port/tests/test_nes_ppu_commands.c -o test_nes_ppu_commands
      - name: Test source-derived PPU command interpreter
        run: ./test_nes_ppu_commands
      - name: Compile native CHR export test
        # asset_export.c calls nesPpuRenderNametable/nesPpuColorToRgb, so
        # nes_ppu_render.c must be linked in too (missing since this step was
        # added on 2026-10-31; the step never executed before 2026-11-01 because
        # the cache test failed earlier in the pipeline).
        run: gcc -std=c11 -O2 -Wall -Wextra -Werror -Wno-unused-function -Wno-sign-compare -Wno-unused-parameter -I3ds-port/include 3ds-port/source/asset_export.c 3ds-port/source/nes_ppu_commands.c 3ds-port/source/nes_ppu_render.c 3ds-port/source/nes_chr_decode.c 3ds-port/source/nes_rom_identify.c 3ds-port/tests/test_asset_export.c -lm -o test_asset_export
      - name: Test native CHR exports
        run: ./test_asset_export
      - name: Compile race setup test
        run: gcc -std=c11 -O2 -Wall -Wextra -Werror -I3ds-port/include 3ds-port/source/nes_race_setup.c 3ds-port/tests/test_nes_race_setup.c -o test_nes_race_setup

      - name: Run race setup test
        run: ./test_nes_race_setup

      - name: Validate reference 6502 core against py65
        run: |
          pip install py65
          gcc -shared -fPIC -O1 -o libcpu.so 3ds-port/tests/oracle/cpu6502.c
          python3 3ds-port/tests/oracle/validate_cpu6502.py ./libcpu.so 3000

      - name: Regenerate recompiled code and check it is up to date
        run: |
          cd 3ds-port
          python3 tools/asm2c.py ../Excitebike/bank_FF.asm /tmp/nes_gen_code.c
          diff -q /tmp/nes_gen_code.c source/nes_gen_code.c

      - name: Differential test of the recompiled game code against the original
        run: |
          cd 3ds-port
          python3 tools/asm_to_prg.py ../Excitebike/bank_FF.asm /tmp/prg.bin
          gcc -std=c11 -O1 -Wall -Wextra -Werror -Iinclude -Itests/oracle tests/oracle/*.c source/nes_gen_code.c source/nes_call.c tests/test_gen_code.c -o /tmp/test_gen_code
          /tmp/test_gen_code /tmp/prg.bin 100

      - name: Compile menu frame-model test
        # menus.c only needs libctru's KEY_* bits; tests/host_stub/3ds.h supplies them on the host.
        run: gcc -std=c11 -O2 -Wall -Wextra -Werror -I3ds-port/include -I3ds-port/tests/host_stub 3ds-port/source/menus.c 3ds-port/source/menu_tape_file.c 3ds-port/source/nes_routines.c 3ds-port/source/nes_active_stream.c 3ds-port/source/nes_ppu_commands.c 3ds-port/source/game_state.c 3ds-port/tests/test_menus.c -o test_menus
      - name: Test menu frame model (NMI order, setup lists, cursor, design menu, tape save/load)
        run: ./test_menus
