name: Verify NES routine translations

on:
  push:
    paths:
      - "3ds-port/source/nes_routines.c"
      - "3ds-port/include/nes_routines.h"
      - "3ds-port/tests/**"
      - "3ds-port/tools/**"
      - "3ds-port/source/nes_chr_decode.c"
      - "3ds-port/include/nes_chr_decode.h"
      - "3ds-port/source/asset_extractor.c"
      - "3ds-port/include/asset_extractor.h"
      - "3ds-port/source/game.c"
      - "3ds-port/source/renderer.c"
      - "3ds-port/source/nes_ppu_render.c"
      - "3ds-port/include/nes_ppu_render.h"
      - "3ds-port/source/nes_ppu_commands.c"
      - "3ds-port/include/nes_ppu_commands.h"
      - "3ds-port/source/asset_export.c"
      - "3ds-port/include/asset_export.h"
      - "3ds-port/include/third_party/stb_image_write.h"
      - "3ds-port/tests/test_nes_chr_decode.c"
      - ".github/workflows/test-nes-routines.yml"
  pull_request:
    paths:
      - "3ds-port/source/nes_routines.c"
      - "3ds-port/include/nes_routines.h"
      - "3ds-port/tests/**"
      - "3ds-port/tools/**"
      - "3ds-port/source/nes_chr_decode.c"
      - "3ds-port/include/nes_chr_decode.h"
      - "3ds-port/source/nes_ppu_render.c"
      - "3ds-port/include/nes_ppu_render.h"
      - "3ds-port/source/asset_extractor.c"
      - "3ds-port/include/asset_extractor.h"
      - "3ds-port/source/game.c"
      - "3ds-port/source/renderer.c"
      - "3ds-port/source/asset_export.c"
      - "3ds-port/include/asset_export.h"
      - "3ds-port/include/third_party/stb_image_write.h"
      - ".github/workflows/test-nes-routines.yml"
  workflow_dispatch:

jobs:
  exhaustive-sub-da15:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python for extraction-tool tests
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Test Python CHR extraction tools
        run: python -m unittest discover -s 3ds-port/tools -p 'test_*.py'
      - name: Compile host-side reference test
        run: gcc -std=c11 -O2 -Wall -Wextra -Werror -I3ds-port/include 3ds-port/source/nes_routines.c 3ds-port/tests/test_nes_routines.c -o test_nes_routines
      - name: Exhaustively compare all 8-bit inputs
        run: ./test_nes_routines
      - name: Compile host-side runtime CHR decoder test
        run: gcc -std=c11 -O2 -Wall -Wextra -Werror -I3ds-port/include 3ds-port/source/nes_chr_decode.c 3ds-port/tests/test_nes_chr_decode.c -o test_nes_chr_decode
      - name: Test runtime CHR decoder
        run: ./test_nes_chr_decode
      - name: Compile native PPU renderer regression test
        run: gcc -std=c11 -O2 -Wall -Wextra -Werror -I3ds-port/include 3ds-port/source/nes_ppu_render.c 3ds-port/tests/test_nes_ppu_render.c -o test_nes_ppu_render
      - name: Test native PPU renderer
        run: ./test_nes_ppu_render
      - name: Compile source-derived PPU command interpreter test
        run: gcc -std=c11 -O2 -Wall -Wextra -Werror -I3ds-port/include 3ds-port/source/nes_ppu_commands.c 3ds-port/tests/test_nes_ppu_commands.c -o test_nes_ppu_commands
      - name: Test source-derived PPU command interpreter
        run: ./test_nes_ppu_commands
      - name: Compile native CHR export test
        run: gcc -std=c11 -O2 -Wall -Wextra -Werror -Wno-unused-function -Wno-sign-compare -Wno-unused-parameter -I3ds-port/include 3ds-port/source/asset_export.c 3ds-port/source/nes_ppu_commands.c 3ds-port/tests/test_asset_export.c -lm -o test_asset_export
      - name: Test native CHR exports
        run: ./test_asset_export
