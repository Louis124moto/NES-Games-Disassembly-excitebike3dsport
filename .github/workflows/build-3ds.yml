name: Build Nintendo 3DS homebrew

on:
  push:
    branches:
      - "**"
    paths-ignore:
      - "3ds-port/build/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Compile Excitebike 3DS
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm:latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Nintendo 3DS development libraries
        run: dkp-pacman -S --noconfirm 3ds-dev

      - name: Compile homebrew
        run: make -C 3ds-port

      - name: Verify build outputs are inside build/
        run: |
          test -s 3ds-port/build/excitebike3ds.3dsx
          test -s 3ds-port/build/excitebike3ds.elf
          test ! -e 3ds-port/excitebike3ds.3dsx
          test ! -e 3ds-port/excitebike3ds.elf
          ls -lh 3ds-port/build/excitebike3ds.3dsx 3ds-port/build/excitebike3ds.elf

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: excitebike3ds-homebrew
          path: |
            3ds-port/build/excitebike3ds.3dsx
            3ds-port/build/excitebike3ds.elf
          if-no-files-found: error
          retention-days: 14

      - name: Commit 3DS build outputs to main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Build: update 3DS binaries"
          file_pattern: 3ds-port/build/excitebike3ds.3dsx 3ds-port/build/excitebike3ds.elf
