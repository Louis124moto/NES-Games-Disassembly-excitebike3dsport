name: Build Nintendo 3DS homebrew

on:
  push:
    branches:
      - "**"
    paths-ignore:
      - "3ds-port/build/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Compile Excitebike 3DS
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm:latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Nintendo 3DS development libraries
        # The devkitpro/devkitarm image already ships the 3ds-dev group, so
        # --needed skips every package that is up to date instead of
        # re-downloading all 20 (a 403 from pkg.devkitpro.org on one of those
        # redundant downloads failed the build on 2026-11-17). The retry only
        # matters if something really is missing and the mirror hiccups.
        run: |
          for attempt in 1 2 3; do
            if dkp-pacman -S --needed --noconfirm 3ds-dev; then exit 0; fi
            echo "dkp-pacman attempt $attempt failed; retrying in $((attempt * 15))s"
            sleep $((attempt * 15))
          done
          exit 1

      - name: Compile homebrew
        run: make -C 3ds-port

      - name: Verify build outputs are inside build/
        run: |
          test -s 3ds-port/build/excitebike3ds.3dsx
          test -s 3ds-port/build/excitebike3ds.elf
          test ! -e 3ds-port/excitebike3ds.3dsx
          test ! -e 3ds-port/excitebike3ds.elf
          ls -lh 3ds-port/build/excitebike3ds.3dsx 3ds-port/build/excitebike3ds.elf

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: excitebike3ds-homebrew
          path: |
            3ds-port/build/excitebike3ds.3dsx
            3ds-port/build/excitebike3ds.elf
          if-no-files-found: error
          retention-days: 14

      - name: Mark checkout as safe for Git in build container
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Commit 3DS build outputs to main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Build: update 3DS binaries"
          file_pattern: 3ds-port/build/excitebike3ds.3dsx 3ds-port/build/excitebike3ds.elf
